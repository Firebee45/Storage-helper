<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAFAFA">
<title>World Code Viewer</title>
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('ws-theme'); } catch (e) {}
  if (t !== 'dark' && t !== 'light') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/effects.css">
<link rel="stylesheet" href="css/viewer.css">
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="#top">Item Extraction</a>
    <div class="nav-right">
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
        <svg class="ico moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
        <svg class="ico sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero code-hero">
    <div class="wrap">
      <h1 class="lead">Enter your world code</h1>
      <div id="codeBoxes" class="code-boxes" role="group" aria-label="6 character world code">
        <input class="code-box" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 1 of 6">
        <input class="code-box" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 2 of 6">
        <input class="code-box" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 3 of 6">
        <input class="code-box" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 4 of 6">
        <input class="code-box" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 5 of 6">
        <input class="code-box" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Character 6 of 6">
      </div>
      <p id="codeMsg" class="code-msg" role="status">Codes are saved in this browser only.</p>
    </div>
  </section>

  <div id="viewer" class="wrap" hidden>
    <p id="viewerMeta" class="viewer-meta"></p>
    <div class="stats">
      <div class="stat"><span class="n">01</span><strong id="vKinds">--</strong><span class="l">Unique item types</span></div>
      <div class="stat"><span class="n">02</span><strong id="vTotal">--</strong><span class="l">Total items counted</span></div>
      <div class="stat"><span class="n">03</span><strong id="vContainers">--</strong><span class="l">Non-empty containers</span></div>
    </div>
    <section class="section">
      <div class="grid-2">
        <div class="card panel">
          <h3>Items</h3>
          <p class="desc">Sorted by quantity, largest first.</p>
          <div class="controls">
            <input id="vSearch" type="search" placeholder="Filter items, for example diamond" aria-label="Filter items">
          </div>
          <div id="vResults" class="empty"></div>
        </div>
        <div class="card panel">
          <h3>Containers</h3>
          <p class="desc">Non-empty containers by type. Shulker boxes of every colour are counted together.</p>
          <div id="vContainerList" class="empty"></div>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="js/utils/helpers.js"></script>
<script src="js/logic/codestore.js"></script>
<script src="js/ui/table.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/viewer.js"></script>
<script src="js/ui/code-input.js"></script>
</body>
</html>
